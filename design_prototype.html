<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design Prototype - Team Directory</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Playfair Display"', 'serif'],
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            // Light Mode: Nature Green
            nature: {
              bg: '#f4f1ea',
              card: '#e8e5d9',
              text: '#2c402e',
              accent: '#8b2615',
              border: '#d0cbb8'
            },
            // Dark Mode: Midnight Blue
            midnight: {
              bg: '#0f172a',
              card: '#1e293b',
              text: '#f8fafc',
              accent: '#fef08a',
              border: '#334155'
            }
          },
          animation: {
            'fade-in-up': 'fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
          },
          keyframes: {
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(40px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          }
        }
      }
    }
  </script>
  
  <style>
    /* Base Theme Variables */
    :root {
      --bg: theme('colors.nature.bg');
      --card: theme('colors.nature.card');
      --text: theme('colors.nature.text');
      --accent: theme('colors.nature.accent');
      --border: theme('colors.nature.border');
    }
    
    .dark {
      --bg: theme('colors.midnight.bg');
      --card: theme('colors.midnight.card');
      --text: theme('colors.midnight.text');
      --accent: theme('colors.midnight.accent');
      --border: theme('colors.midnight.border');
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      transition: background-color 0.5s ease, color 0.5s ease;
    }
    
    .theme-card {
      background-color: var(--card);
      border-color: var(--border);
    }
    
    .theme-accent {
      color: var(--accent);
    }
    
    .theme-accent-bg {
      background-color: var(--accent);
    }
    
    .theme-accent-border {
      border-color: var(--accent);
    }

    /* Scroll Animation */
    .animate-on-scroll {
      opacity: 0;
    }
    
    .is-visible {
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="antialiased font-sans min-h-screen selection:bg-nature-accent selection:text-white dark:selection:bg-midnight-accent dark:selection:text-black">

  <nav class="sticky top-0 z-50 backdrop-blur-md border-b border-[var(--border)] bg-[var(--bg)]/80">
    <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
      <h1 class="font-serif text-2xl font-semibold tracking-wide italic">The Directory</h1>
      <button id="theme-toggle" class="px-4 py-2 text-sm font-medium border border-[var(--border)] rounded-full hover:bg-[var(--card)] transition-colors">
        Toggle Theme
      </button>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-6 py-16">
    <header class="text-center mb-24 animate-on-scroll">
      <h2 class="font-serif text-5xl md:text-7xl mb-6 leading-tight">Meet the <br/> <span class="theme-accent italic">Brilliant Minds</span></h2>
      <p class="max-w-2xl mx-auto text-lg opacity-80 font-light">A curated collection of our team members, designed with botanical elegance in the light and sophisticated midnight blue in the dark.</p>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" id="card-container">
      <!-- Cards injected by JS -->
    </div>
  </main>

  <script>
    // Theme Toggle Logic
    const themeToggle = document.getElementById('theme-toggle');
    const htmlElement = document.documentElement;
    
    themeToggle.addEventListener('click', () => {
      htmlElement.classList.toggle('dark');
    });

    // Generate Dummy Cards
    const users = [
      { name: 'Eleanor Vance', role: 'Creative Director', company: 'The Garden Club' },
      { name: 'Julian Baker', role: 'Lead Designer', company: 'Studio Botanica' },
      { name: 'Sofia Chen', role: 'UX Architect', company: 'Midnight Labs' },
      { name: 'Marcus Sterling', role: 'Senior Developer', company: 'The Meadows' },
      { name: 'Aria Montgomery', role: 'Product Manager', company: 'Summer Picnic' },
      { name: 'Leo Kingston', role: 'Brand Strategist', company: 'Creative Co.' },
    ];

    const container = document.getElementById('card-container');
    
    users.forEach((user, index) => {
      const card = document.createElement('div');
      card.style.animationDelay = `${index * 150}ms`;
      card.className = 'theme-card border p-8 rounded-lg flex flex-col items-center text-center transition-transform hover:-translate-y-2 hover:shadow-xl duration-300 animate-on-scroll relative group';
      
      card.innerHTML = `
        <button class="absolute top-4 right-4 p-2 rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors group/fav" onclick="this.classList.toggle('text-[var(--accent)]'); this.querySelector('svg').classList.toggle('fill-current'); this.classList.toggle('scale-110');">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="transition-transform duration-300 group-active/fav:scale-75">
            <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
          </svg>
        </button>
        <div class="w-24 h-24 rounded-full overflow-hidden mb-6 border-2 border-[var(--border)] group-hover:theme-accent-border transition-colors">
          <img src="https://api.dicebear.com/7.x/notionists/svg?seed=${user.name}&backgroundColor=transparent" alt="${user.name}" class="w-full h-full object-cover">
        </div>
        <h3 class="font-serif text-2xl mb-2">${user.name}</h3>
        <p class="text-sm uppercase tracking-widest opacity-60 mb-1 font-medium">${user.role}</p>
        <p class="text-sm font-serif italic opacity-75">${user.company}</p>
        <button class="mt-8 px-6 py-2 border border-[var(--border)] group-hover:bg-[var(--accent)] group-hover:text-[var(--bg)] transition-colors duration-300 rounded-md text-sm uppercase tracking-wider">View Profile</button>
      `;
      
      container.appendChild(card);
    });

    // Intersection Observer for Scroll Animations
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target);
        }
      });
    }, {
      threshold: 0.1,
      rootMargin: "0px 0px -50px 0px"
    });

    document.querySelectorAll('.animate-on-scroll').forEach(el => {
      observer.observe(el);
    });
  </script>
</body>
</html>
